<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache">

        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="theme-color" content="#060812">

        <link rel="apple-touch-icon" href="logo.png">
        <link rel="icon" href="logo.png">

        <title>FLUX — Fluid Studio</title>
        <meta name="description" content="A SaaS-style control studio for a real-time WebGL fluid simulation.">

        <meta property="og:type" content="website">
        <meta property="og:title" content="FLUX — Fluid Studio">
        <meta property="og:description" content="A SaaS-style control studio for a real-time WebGL fluid simulation.">
        <meta property="og:image" content="https://paveldogreat.github.io/WebGL-Fluid-Simulation/logo.png">

        <link rel="stylesheet" href="ui.css">
        <script>
            window.ga = window.ga || function () {};
            // Apply saved theme before paint to avoid a flash.
            try { if (localStorage.getItem('flux-theme') === 'light') document.documentElement.classList.add('light'); } catch (e) {}
        </script>
    </head>
    <body>
        <canvas></canvas>
        <div class="vignette"></div>

        <!-- ============ Loader ============ -->
        <div class="loader" id="loader">
            <div class="loader-inner">
                <div class="loader-orb"></div>
                <div class="loader-name">FLUX</div>
                <div class="loader-bar"><span></span></div>
            </div>
        </div>

        <!-- ============ Left nav rail ============ -->
        <nav class="rail glass" id="rail" data-anim>
            <div class="rail-logo"></div>
            <div class="rail-nav">
                <button class="nav-btn on" data-target="card-presets" aria-label="Presets">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg>
                    <span class="tip">Presets</span>
                </button>
                <button class="nav-btn" data-target="card-dynamics" aria-label="Dynamics">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5 8h9M18 8h1M5 16h1M10 16h9"/><circle cx="16" cy="8" r="2.1"/><circle cx="8" cy="16" r="2.1"/></svg>
                    <span class="tip">Dynamics</span>
                </button>
                <button class="nav-btn" data-target="card-appearance" aria-label="Appearance">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span class="tip">Appearance</span>
                </button>
                <button class="nav-btn" data-target="card-quality" aria-label="Quality">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13a5 5 0 015-5M12 21a9 9 0 119-9"/><circle cx="12" cy="13" r="1.4" fill="currentColor" stroke="none"/></svg>
                    <span class="tip">Quality</span>
                </button>
                <button class="nav-btn" data-target="card-capture" aria-label="Capture">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 015.5 6h1.2l1-1.6A1.5 1.5 0 019 3.7h6a1.5 1.5 0 011.3.7l1 1.6h1.2A2.5 2.5 0 0121 8.5v8A2.5 2.5 0 0118.5 19h-13A2.5 2.5 0 013 16.5z"/><circle cx="12" cy="12.5" r="3.3"/></svg>
                    <span class="tip">Capture</span>
                </button>
            </div>
            <div class="rail-spacer"></div>
            <button class="nav-btn" id="nav-github" aria-label="Source on GitHub">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2C6.5 2 2 6.6 2 12.2c0 4.5 2.9 8.3 6.8 9.6.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.2-3.4-1.2-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.3 9.3 0 015 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0022 12.2C22 6.6 17.5 2 12 2z"/></svg>
                <span class="tip">Source</span>
            </button>
        </nav>

        <!-- ============ Top header ============ -->
        <header class="topbar glass" data-anim>
            <div class="crumbs">
                <span class="title">Fluid Engine</span>
                <span class="sep">/</span>
                <span class="chip"><span class="live-dot"></span> Live Session</span>
            </div>
            <div class="top-actions">
                <button class="icon-btn" id="btn-play" title="Play / Pause (P)" aria-label="Play or pause">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path class="ico-play" d="M7 5l12 7-12 7V5z" fill="currentColor" stroke="none"/>
                        <g class="ico-pause"><rect x="7" y="5" width="3.5" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.5" y="5" width="3.5" height="14" rx="1" fill="currentColor" stroke="none"/></g>
                    </svg>
                </button>
                <button class="icon-btn" id="btn-burst" title="Random burst (Space)" aria-label="Random burst">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>
                </button>
                <button class="icon-btn primary" id="btn-snap" title="Save snapshot" aria-label="Save snapshot">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 015.5 6h1.2l1-1.6A1.5 1.5 0 019 3.7h6a1.5 1.5 0 011.3.7l1 1.6h1.2A2.5 2.5 0 0121 8.5v8A2.5 2.5 0 0118.5 19h-13A2.5 2.5 0 013 16.5z"/><circle cx="12" cy="12.5" r="3.3"/></svg>
                </button>
                <button class="icon-btn" id="btn-theme" title="Toggle light / dark" aria-label="Toggle theme">
                    <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
                    <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 119.5 4a6.3 6.3 0 0010.5 10.5z"/></svg>
                </button>
                <span class="top-divider"></span>
                <button class="icon-btn" id="btn-settings" title="Toggle inspector" aria-label="Toggle inspector">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="profile" title="Studio">
                    <div class="avatar">FX</div>
                    <div class="who"><b>Studio</b><span>Pro plan</span></div>
                </div>
            </div>
        </header>

        <!-- ============ Right inspector ============ -->
        <aside class="panel glass" id="panel">
            <div class="panel-head">
                <div>
                    <span class="kicker">Inspector</span>
                    <h2>Engine Settings</h2>
                </div>
                <button class="panel-close" id="panel-close" aria-label="Close inspector">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div class="panel-body" id="panel-body"></div>
        </aside>

        <!-- ============ Hint ============ -->
        <div class="hint glass" id="hint">
            <span><b>Drag</b> to paint</span>
            <span class="dot"></span>
            <span><b>Tap</b> for a burst</span>
        </div>

        <script src="gsap.min.js"></script>
        <script src="ui.js"></script>
        <script src="./script.js"></script>
    </body>
</html>
